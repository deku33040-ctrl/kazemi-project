<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{'ویرایش نوشته' if post else 'نوشته جدید'}} | کاظمی</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#18263a;font:15px Tahoma;line-height:1.9}.top{background:#fff;border-bottom:1px solid #dce4ef;padding:15px 4%;display:flex;justify-content:space-between}.wrap{max-width:1000px;margin:28px auto;padding:0 16px}.panel{background:#fff;border:1px solid #dce4ef;border-radius:14px;padding:22px}h1{color:#17365d;margin-top:0}label{display:block;margin:12px 0 5px;color:#64748b}input,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn,button{background:#17365d;color:white;border:0;border-radius:8px;padding:10px 16px;text-decoration:none;cursor:pointer;font-weight:bold}.toolbar{display:flex;gap:6px;flex-wrap:wrap;background:#f1f5f9;padding:10px;border:1px solid #cbd5e1;border-radius:10px 10px 0 0}.toolbar button{padding:7px 10px}.editor{min-height:380px;padding:18px;border:1px solid #cbd5e1;border-top:0;border-radius:0 0 10px 10px;outline:none;line-height:2}.editor img{max-width:100%;height:auto}.editor figure{text-align:center}.editor figcaption{font-size:13px;color:#64748b}.muted{font-size:13px;color:#64748b}.actions{display:flex;gap:10px;margin-top:18px;align-items:center}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><b>پیمانکاری کاظمی / {{'ویرایش نوشته' if post else 'نوشته جدید'}}</b><a class="btn" href="/admin/posts">بازگشت به نوشته‌ها</a></header><main class="wrap"><section class="panel"><h1>{{'ویرایش نوشته' if post else 'ساخت نوشته جدید'}}</h1><form id="postForm" method="post" action="{{'/admin/blog/'+post.id|string+'/edit' if post else '/admin/blog/add'}}" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><div class="grid"><div><label>عنوان نوشته</label><input name="title" required maxlength="180" value="{{post.title if post else ''}}" placeholder="عنوان مقاله"></div><div><label>نشانی نوشته (اختیاری)</label><input name="slug" {% if post %}value="{{post.slug}}"{% endif %} placeholder="stone-guide"></div></div><label>خلاصه نوشته</label><textarea name="excerpt" maxlength="500">{{post.excerpt if post else ''}}</textarea><label>متن مقاله</label><div class="toolbar" id="toolbar"><button type="button" data-cmd="bold">پررنگ</button><button type="button" data-cmd="italic">مورب</button><button type="button" data-block="h2">عنوان</button><button type="button" data-block="h3">زیرعنوان</button><button type="button" data-cmd="insertUnorderedList">فهرست</button><button type="button" data-cmd="insertOrderedList">شماره‌ای</button><button type="button" id="linkBtn">لینک</button><button type="button" id="imageBtn">درج تصویر</button><button type="button" id="tableBtn">جدول</button></div><div id="editor" class="editor" contenteditable="true">{{post.content|safe if post else ''}}</div><textarea name="content" id="content" hidden required>{{post.content if post else ''}}</textarea><input type="file" id="inlineImage" accept="image/*" hidden><div class="grid"><div><label>تصویر شاخص</label><input type="file" name="image" accept="image/*"></div><div><label>توضیحات سئو</label><input name="meta_description" maxlength="300" value="{{post.meta_description if post else ''}}"></div></div><label><input type="checkbox" name="is_published" style="width:auto" {% if not post or post.is_published %}checked{% endif %}> انتشار عمومی نوشته</label><div class="actions"><button type="submit">ذخیره نوشته</button><a class="btn" href="/admin/posts">انصراف</a></div></form></section></main><script>
const editor=document.getElementById('editor'),content=document.getElementById('content'),form=document.getElementById('postForm');let savedRange=null;document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{editor.focus();document.execCommand(b.dataset.cmd,false,null)});document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{editor.focus();document.execCommand('formatBlock',false,b.dataset.block)});document.getElementById('linkBtn').onclick=()=>{const u=prompt('آدرس لینک را وارد کن');if(u){editor.focus();document.execCommand('createLink',false,u)}};document.getElementById('tableBtn').onclick=()=>{editor.focus();document.execCommand('insertHTML',false,'<table border="1" style="width:100%"><tr><td>متن</td><td>متن</td></tr><tr><td>متن</td><td>متن</td></tr></table><p><br></p>')};document.getElementById('imageBtn').onclick=()=>{const s=getSelection();if(s.rangeCount)savedRange=s.getRangeAt(0).cloneRange();document.getElementById('inlineImage').click()};document.getElementById('inlineImage').onchange=async e=>{if(!e.target.files[0])return;const fd=new FormData();fd.append('csrf_token','{{csrf_token}}');fd.append('image',e.target.files[0]);const r=await fetch('/admin/blog/image-upload',{method:'POST',body:fd}),j=await r.json();if(!r.ok){alert(j.error||'آپلود ناموفق');return}editor.focus();if(savedRange){const s=getSelection();s.removeAllRanges();s.addRange(savedRange)}document.execCommand('insertHTML',false,'<figure><img src="'+j.url+'" alt="تصویر مقاله"><figcaption contenteditable="true">توضیح تصویر</figcaption></figure><p><br></p>');e.target.value=''};form.onsubmit=()=>content.value=editor.innerHTML;
</script></body></html>
